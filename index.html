<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<title>Технологічні карти</title>
<link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=18vPnHT5kP0HoNdX_hX3K5NgHwfLW1nxM&sz=w192">
<link rel="apple-touch-icon" href="https://drive.google.com/thumbnail?id=18vPnHT5kP0HoNdX_hX3K5NgHwfLW1nxM&sz=w192">
<style>
:root{--bg:#121212;--card:#1e1e1e;--bar:#242424;--line:#333;--tx:#e8e8e8;--dim:#9a9a9a;--ac:#1dbfa0;--hd:#0c0c0c}
@media(prefers-color-scheme:light){:root[data-auto]{}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Roboto,system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--bar);border-bottom:1px solid var(--line)}
header h1{flex:1;font-size:20px;font-weight:400;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#logo{width:30px;height:30px;fill:var(--ac);flex:none}
.ib svg{width:26px;height:26px;fill:currentColor}
.ib{display:flex;align-items:center;justify-content:center;flex:none}
#rf{color:#fdd835}
@keyframes sp{to{transform:rotate(360deg)}}.spin svg{animation:sp 1s linear infinite}
nav svg{width:24px;height:24px;fill:currentColor}
.lk{display:flex;align-items:center;gap:10px}.lk a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;word-break:normal}.lk svg{width:26px;height:26px;fill:var(--dim);flex:none}
.c svg{width:28px;height:28px;fill:var(--dim)}
button{background:none;border:0;color:var(--tx);font:inherit;cursor:pointer}
.ib{width:40px;height:40px;border-radius:50%}
#q{display:block;margin:8px 14px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;width:calc(100% - 28px)}
main{flex:1;overflow-y:auto}
.grp{position:sticky;top:0;background:var(--hd);padding:12px 14px;font-size:22px;border-bottom:1px solid var(--line);z-index:1}
.grp b{font-size:14px;font-weight:400;background:#777;border-radius:6px;padding:2px 8px;margin-left:8px}
.it{display:flex;gap:14px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.th{width:100px;height:80px;flex:none;display:flex;align-items:center;justify-content:center}
.th img{max-width:100%;max-height:100%;object-fit:contain}
.it .t{flex:1;min-width:0}
.it .n{font-size:18px}.it .s{color:var(--dim);margin-top:4px}
.it .c{align-self:flex-end;flex:none;padding:8px;margin:-8px;border-radius:8px}
.it .c:hover svg{fill:var(--ac)}
.empty{padding:40px;text-align:center;color:var(--dim)}
nav{display:flex;background:var(--bar);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:10px 0 12px;color:var(--dim);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button i{font-style:normal;width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
nav button.on{color:var(--ac)}nav button.on i{background:var(--ac);color:#062}
.hero{background:var(--card);padding:10px;text-align:center}
.hero img{max-width:100%;max-height:260px;object-fit:contain}
.dt{padding:16px 14px}
.dt h2{font-size:28px;font-weight:400;margin:6px 0}
.dt .sub{color:var(--dim)}
.f{margin-top:18px}.f label{display:block;color:var(--dim);font-size:15px}
.f div,.f a{font-size:18px;color:var(--tx);word-break:break-all}
.f a{color:var(--ac)}
.f img{max-width:100%;border-radius:4px;margin-top:6px;cursor:zoom-in}
#lb{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:9}
#lb img{max-width:100%;max-height:100%}
#st{font-size:12px;color:var(--dim);padding:4px 14px}

.gl{display:block}.dv{display:block}
@media(min-width:600px){
 .gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;padding:12px 14px}
 .it{border:1px solid var(--line);border-radius:12px;transition:background .15s,border-color .15s}
 .it:hover{background:#272727;border-color:var(--ac)}
 .th{width:110px;height:90px}
 .grp{border-bottom:0;background:var(--bg);font-size:24px;padding:16px 14px 0}
}
@media(min-width:900px){
 #app{display:grid;grid-template-columns:240px 1fr;grid-template-rows:auto auto auto minmax(0,1fr);grid-template-areas:"h h" "n q" "n s" "n m"}
 header{grid-area:h;padding:12px 20px}header h1{font-size:22px}
 #q{grid-area:q;margin:12px 20px 0;width:calc(100% - 40px)}
 #st{grid-area:s;padding:4px 20px}
 main{grid-area:m;min-height:0}
 nav{grid-area:n;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--line);padding:16px 10px}
 nav button{flex:none;flex-direction:row;gap:14px;padding:6px 10px;border-radius:28px;font-size:16px;text-align:left}
 nav button:hover{background:#2a2a2a}
 nav button i{width:52px;height:36px}
 .gl{padding:12px 20px;gap:14px;grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
 .grp{padding:20px 20px 0}
 .hero{margin:20px 0 20px 20px;border-radius:12px;align-self:start;position:sticky;top:20px}
 .hero img{max-height:480px}
 .dv{display:grid;grid-template-columns:minmax(300px,5fr) 6fr}
 .dv>.dt:only-child{grid-column:1/-1}
 .dt{padding:20px 28px}
 .dt h2{font-size:32px}
}
.det nav{display:none}
@media(min-width:900px){.det nav{display:flex}}

*{scrollbar-width:thin;scrollbar-color:#4a4a4a transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3c3c3c;border-radius:10px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ac)}
::-webkit-scrollbar-corner{background:transparent}
</style>
</head>
<body>
<div id="app">
<header>
<button class="ib" id="bk"></button>
<svg id="logo" viewBox="0 0 24 24"><path d="M12 0c.6 5.6 5.4 11.4 12 12-6.6.6-11.4 6.4-12 12C11.4 18.4 6.6 12.6 0 12 6.6 11.4 11.4 5.6 12 0z"/></svg>
<h1 id="ti">Технологічні карти</h1>
<button class="ib" id="sb"></button>
<button class="ib" id="rf" title="Оновити"></button>
</header>
<input id="q" placeholder="Пошук…" type="search">
<div id="st"></div>
<main id="mn"></main>
<nav id="nv">
<button data-t="fit"><i class="ic" data-k="dots"></i>Слюсарні роботи</button>
<button data-t="weld"><i class="ic" data-k="dots"></i>Зварювання</button>
<button data-t="dwg"><i class="ic" data-k="list"></i>Креслення</button>
</nav>
</div>
<div id="lb"><img alt=""></div>

<script>
/* ===== НАЛАШТУВАННЯ ===== */
const CFG={
  SHEET_ID:'1rnTnyv_MSWFP_4czMRCxnnKIZ0S_kB3nJW3Hprii0HQ',
  SHEET_NAME:'Техкарти',
  DWG_SHEET:'1) Лазерна порізка',   // вкладка «Креслення» бере дані звідси
  FOLDER_ID:'1-fi9L6io4vUFKCB86hdxJWLtexU8DHYp',   // папка Техкарти_Images
  API_KEY:'AIzaSyAzaHxgzTd3hSno8kgGeDAfqGtujU61JcE'                                        // Google API key (Drive API), див. інструкцію
};
/* ========================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I={
 menu:'<svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>',
 back:'<svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>',
 search:'<svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>',
 alert:'<svg viewBox="0 0 24 24"><path d="M11 15h2v2h-2zm0-8h2v6h-2zm.99-5C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg>',
 ext:'<svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>',
 link:'<svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>',
 list:'<svg viewBox="0 0 24 24"><path d="M19 5v14H5V5h14m1.1-2H3.9c-.5 0-.9.4-.9.9v16.2c0 .5.4.9.9.9h16.2c.5 0 .9-.4.9-.9V3.9c0-.5-.4-.9-.9-.9zM11 7h6v2h-6V7zm0 4h6v2h-6v-2zm0 4h6v2h-6v-2zM7 7h2v2H7V7zm0 4h2v2H7v-2zm0 4h2v2H7v-2z"/></svg>',
 ok:'<svg viewBox="0 0 24 24"><path d="M16.59 7.58L10 14.17l-3.59-3.58L5 12l5 5 8-8zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg>',
 load:'<svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>',
 dots:'<svg viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:1.8"><circle cx="4.5" cy="12" r="2.4"/><circle cx="12" cy="12" r="2.4"/><circle cx="19.5" cy="12" r="2.4"/></svg>'
};
$('#sb').innerHTML=I.search;
const SC={load:['#fdd835','Оновлення…'],ok:['#66bb6a','Дані актуальні. Натисніть, щоб оновити'],err:['#f28b82','Помилка або немає підключення. Натисніть, щоб повторити']};
function setStatus(k){const b=$('#rf');b.innerHTML=I[k=='err'?'alert':k];b.style.color=SC[k][0];b.title=SC[k][1];b.classList.toggle('spin',k=='load')}
setStatus('load');
$('#bk').innerHTML=I.back;$('#bk').style.display='none';
document.querySelectorAll('.ic').forEach(e=>e.innerHTML=I[e.dataset.k]);
let items=[],dwg=[],imgMap={},tab=localStorage.tab||'weld',cur=null;

function csv(t){const r=[];let row=[],f='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;else if(c==','){row.push(f);f=''}
  else if(c=='\n'){row.push(f);r.push(row);row=[];f=''}else if(c!='\r')f+=c}
 if(f||row.length){row.push(f);r.push(row)}return r}

async function load(force){
 let bad=0;setStatus('load');$('#st').textContent='Оновлення…';
 async function sheet(name,p){
  const u=`https://docs.google.com/spreadsheets/d/${CFG.SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}`;
  const t=await (await fetch(u)).text();
  const rows=csv(t).filter(r=>r.some(x=>x.trim()));
  const h=rows[0].map(x=>x.trim());
  return rows.slice(1).map((r,i)=>{const o={id:p+i};h.forEach((k,j)=>o[k]=(r[j]||'').trim());return o}).filter(o=>o['Виріб']);
 }
 try{
  items=await sheet(CFG.SHEET_NAME,'t');dwg=await sheet(CFG.DWG_SHEET,'d');
  localStorage.items=JSON.stringify(items);localStorage.dwg=JSON.stringify(dwg);
 }catch(e){items=JSON.parse(localStorage.items||'[]');dwg=JSON.parse(localStorage.dwg||'[]');bad=1;$('#st').textContent='Офлайн: показано збережені дані';}
 if(CFG.API_KEY){
  try{
   const u=`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(`'${CFG.FOLDER_ID}' in parents and trashed=false`)}&fields=files(id,name)&pageSize=1000&key=${CFG.API_KEY}`;
   const j=await (await fetch(u)).json();
   if(j.files){imgMap={};j.files.forEach(f=>imgMap[f.name.toLowerCase()]=f.id);localStorage.imgMap=JSON.stringify(imgMap)}else bad=1;
  }catch(e){bad=1}
 }
 if(!Object.keys(imgMap).length)imgMap=JSON.parse(localStorage.imgMap||'{}');
 if($('#st').textContent=='Оновлення…')$('#st').textContent='';
 setStatus(bad||!(items.length+dwg.length)?'err':'ok');
 render();
}
function img(p,w=600){
 if(!p)return'';const n=p.split('/').pop().trim().toLowerCase();
 const id=imgMap[n];return id?`https://drive.google.com/thumbnail?id=${id}&sz=w${w}`:'';
}
const OPS={fit:'Слюсар',weld:'Зварю'};
const TT={fit:'Слюсарні роботи',weld:'Зварювання',dwg:'Креслення'};
function list(){
 const q=$('#q').value.toLowerCase();
 return (tab=='dwg'?dwg:items.filter(o=>o['Операція'].includes(OPS[tab])))
  .filter(o=>!q||(o['Виріб']+o['Замовник']).toLowerCase().includes(q));
}
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 $('#bk').style.display='none';$('#ti').textContent=TT[tab];document.body.classList.remove('det');
 const l=list(),g={};l.forEach(o=>(g[o['Замовник']||'—']??=[]).push(o));
 let h='';
 for(const k of Object.keys(g).sort()){
  h+=`<div class="grp">${esc(k)}<b>${g[k].length}</b></div><div class="gl">`;
  for(const o of g[k]){const s=img(o['Фото виробу'],300);
   h+=`<div class="it" data-i="${o.id}"><div class="th">${s?`<img src="${s}" loading="lazy" alt="">`:'📐'}</div>
   <div class="t"><div class="n">${esc(o['Виріб'])}</div><div class="s">${tab=='dwg'?'':esc(o['Операція'])}</div></div>
   <div class="c">${o['Креслення']?(tab=='dwg'?I.link:I.ext):''}</div></div>`}
  h+='</div>';
 }
 $('#mn').innerHTML=h||'<div class="empty">Нічого не знайдено</div>';
}
function detail(id){
 const o=items.concat(dwg).find(x=>x.id==id);cur=id;if(!o)return;const D=o.id[0]=='d';if(!o)return;
 $('#bk').innerHTML=I.back;$('#bk').style.display='';$('#ti').textContent=o['Виріб'];document.body.classList.add('det');
 const a=(l,v)=>v?`<div class="f"><label>${l}</label><div class="lk"><a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>${I.ext}</div></div>`:'';
 const p=img(o['Фото виробу'],900),t=img(o['Фото техкарти'],900);
 $('#mn').innerHTML=`<div class="dv">${p?`<div class="hero"><img src="${p}" alt=""></div>`:''}
 <div class="dt"><h2>${esc(o['Виріб'])}</h2><div class="sub">${esc(o['Операція'])}</div>
 ${o['Технологічна карта']?`<div class="f"><div>${esc(o['Технологічна карта'])}</div></div>`:''}
 ${a('Креслення',o['Креслення'])}${a('Відео техпроцесу',o['Відео техпроцесу'])}
 ${o['Час виконання (хв):']&&!D?`<div class="f"><label>Час виконання (хв):</label><div style="font-size:24px">${esc(o['Час виконання (хв):'])}</div></div>`:''}
 ${t&&!D?`<div class="f"><label>Фото техкарти</label><img src="${t}" alt=""></div>`:''}
 <div class="f"><label>Замовник</label><div style="font-size:24px">${esc(o['Замовник'])}</div></div></div></div>`;
 $('#mn').scrollTop=0;
}
document.addEventListener('click',e=>{
 const it=e.target.closest('.it');
 if(e.target.closest('.c')&&it){const o=items.concat(dwg).find(x=>x.id==it.dataset.i);
  if(o&&o['Креслення']){window.open(o['Креслення'],'_blank','noopener');return}}
 if(it){const id=it.dataset.i,o=dwg.find(x=>x.id==id);
  if(tab=='dwg'&&o&&o['Креслення']){window.open(o['Креслення'],'_blank','noopener');return}
  history.pushState({d:id},'');detail(id);return}
 const n=e.target.closest('nav button');
 if(n){tab=n.dataset.t;localStorage.tab=tab;render()}
 if(e.target.matches('.f img,.hero img')){$('#lb img').src=e.target.src;$('#lb').style.display='flex'}
 if(e.target.closest('#lb'))$('#lb').style.display='none';
});
$('#bk').onclick=()=>{if(document.body.classList.contains('det'))history.back()};
window.onpopstate=()=>render();
$('#rf').onclick=()=>load(true);
addEventListener('offline',()=>setStatus('err'));addEventListener('online',()=>load());
$('#sb').onclick=()=>$('#q').focus();
$('#q').oninput=render;
document.addEventListener('keydown',e=>{
 if(e.key=='Escape'){$('#lb').style.display='none';if(document.body.classList.contains('det'))history.back()}
 if(e.key=='/'&&document.activeElement!=$('#q')){e.preventDefault();$('#q').style.display='block';$('#q').focus()}
});
load();
</script>
</body>
</html>
